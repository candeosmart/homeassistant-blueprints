blueprint:
  name: Candeo Modmote - Zigbee2MQTT (v2)
  description: >
    Control 12 Modmote button actions (single, double, and long press on each
    of four buttons) with Zigbee2MQTT MQTT device triggers. No legacy action
    sensor is needed. In Zigbee2MQTT, set operation_mode to event, then press
    each button action at least once so Home Assistant discovers its MQTT
    device triggers before using this blueprint. Long presses take about
    three seconds.
  domain: automation
  author: Candeo Smart
  source_url: https://github.com/candeosmart/homeassistant-blueprints/blob/main/candeo-modmote-blueprint-zigbee2mqtt-v2.yaml
  homeassistant:
    min_version: 2024.6.0
  input:
    modmote_device:
      name: Candeo Modmote device
      description: >
        Select the Modmote MQTT device (not a sensor entity). Set its
        operation_mode to event in Zigbee2MQTT and first perform the
        button actions to register their MQTT device triggers.
      selector:
        device:
          filter:
            - integration: mqtt
    button_one:
      name: Button 1 (top left)
      icon: mdi:numeric-1-box-outline
      collapsed: true
      input:
        button_one_short_press:
          name: Single press
          description: Action to run on button 1 (top left) single press.
          default: []
          selector:
            action: {}
        button_one_double_press:
          name: Double press
          description: Action to run on button 1 (top left) double press.
          default: []
          selector:
            action: {}
        button_one_long_press:
          name: Long press
          description: Action to run on button 1 (top left) long press.
          default: []
          selector:
            action: {}
    button_two:
      name: Button 2 (top right)
      icon: mdi:numeric-2-box-outline
      collapsed: true
      input:
        button_two_short_press:
          name: Single press
          description: Action to run on button 2 (top right) single press.
          default: []
          selector:
            action: {}
        button_two_double_press:
          name: Double press
          description: Action to run on button 2 (top right) double press.
          default: []
          selector:
            action: {}
        button_two_long_press:
          name: Long press
          description: Action to run on button 2 (top right) long press.
          default: []
          selector:
            action: {}
    button_three:
      name: Button 3 (bottom left)
      icon: mdi:numeric-3-box-outline
      collapsed: true
      input:
        button_three_short_press:
          name: Single press
          description: Action to run on button 3 (bottom left) single press.
          default: []
          selector:
            action: {}
        button_three_double_press:
          name: Double press
          description: Action to run on button 3 (bottom left) double press.
          default: []
          selector:
            action: {}
        button_three_long_press:
          name: Long press
          description: Action to run on button 3 (bottom left) long press.
          default: []
          selector:
            action: {}
    button_four:
      name: Button 4 (bottom right)
      icon: mdi:numeric-4-box-outline
      collapsed: true
      input:
        button_four_short_press:
          name: Single press
          description: Action to run on button 4 (bottom right) single press.
          default: []
          selector:
            action: {}
        button_four_double_press:
          name: Double press
          description: Action to run on button 4 (bottom right) double press.
          default: []
          selector:
            action: {}
        button_four_long_press:
          name: Long press
          description: Action to run on button 4 (bottom right) long press.
          default: []
          selector:
            action: {}

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "1_single"
    id: button_1_single
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "1_double"
    id: button_1_double
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "1_hold"
    id: button_1_hold
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "2_single"
    id: button_2_single
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "2_double"
    id: button_2_double
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "2_hold"
    id: button_2_hold
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "3_single"
    id: button_3_single
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "3_double"
    id: button_3_double
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "3_hold"
    id: button_3_hold
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "4_single"
    id: button_4_single
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "4_double"
    id: button_4_double
  - trigger: device
    domain: mqtt
    device_id: !input modmote_device
    type: action
    subtype: "4_hold"
    id: button_4_hold

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: button_1_single
        sequence: !input button_one_short_press
      - conditions:
          - condition: trigger
            id: button_1_double
        sequence: !input button_one_double_press
      - conditions:
          - condition: trigger
            id: button_1_hold
        sequence: !input button_one_long_press
      - conditions:
          - condition: trigger
            id: button_2_single
        sequence: !input button_two_short_press
      - conditions:
          - condition: trigger
            id: button_2_double
        sequence: !input button_two_double_press
      - conditions:
          - condition: trigger
            id: button_2_hold
        sequence: !input button_two_long_press
      - conditions:
          - condition: trigger
            id: button_3_single
        sequence: !input button_three_short_press
      - conditions:
          - condition: trigger
            id: button_3_double
        sequence: !input button_three_double_press
      - conditions:
          - condition: trigger
            id: button_3_hold
        sequence: !input button_three_long_press
      - conditions:
          - condition: trigger
            id: button_4_single
        sequence: !input button_four_short_press
      - conditions:
          - condition: trigger
            id: button_4_double
        sequence: !input button_four_double_press
      - conditions:
          - condition: trigger
            id: button_4_hold
        sequence: !input button_four_long_press

mode: queued
max: 10
max_exceeded: silent

blueprint:
  name: Candeo C-ZB-RD1P (DPM mode) - Wired Light + Button Actions in ZHA
  description: >
    **Wired light control with extra actions for RD1-Pro in Dual Purpose Mode using ZHA**

    Use a Candeo RD1-Pro in DPM mode to control the wired light and still get remote actions for advanced automations.

    Single press toggles the wired light, rotation adjusts brightness, and you can assign custom actions to double press, hold, and release.


    **Features:**

    - **Single press**: Toggles your wired light
    - **Double press**: Runs your custom action set
    - **Hold** and **Release**: Run separate custom actions
    - **Rotary control:**
      - ➕ Right rotation brightens by an adjustable step
      - ➖ Left rotation dims by an adjustable step


    **Requirements:**

    - C-ZB-RD1P or C-ZB-RD1Pv2 in Dual Purpose Mode
    - ZHA with device actions available
    - Wired light exposed as a Home Assistant `light` entity


    **Version**: 2026.8

    **Compatible Devices**:
    Candeo C-ZB-RD1P-DPM and C-ZB-RD1Pv2-DPM

  domain: automation

  homeassistant:
    min_version: 2024.6.0

  input:
    device_section:
      name: Device & Wired Light
      icon: mdi:devices
      input:
        remote_device:
          name: RD1-Pro Device (DPM)
          description: Select the RD1-Pro or RD1-Prov2 device in Dual Purpose Mode.
          selector:
            device:
              filter:
                - integration: zha
                  manufacturer: Candeo
                  model: C-ZB-RD1P-DPM
                - integration: zha
                  manufacturer: Candeo
                  model: C-ZB-RD1Pv2-DPM

        wired_light:
          name: Wired Light Entity
          description: "Choose the light entity of the same RD1-Pro device."
          selector:
            entity:
              filter:
                - domain: light

    control_section:
      name: Control Settings
      icon: mdi:tune
      input:
        brightness_step_pct:
          name: Brightness Step Percentage
          default: 10
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "%"

    actions_section:
      name: Extra Actions
      icon: mdi:gesture-double-tap
      input:
        on_double_press:
          name: Double Press Actions
          default: []
          selector:
            action: {}

        on_hold:
          name: Hold Actions
          default: []
          selector:
            action: {}

        on_release:
          name: Release Actions
          default: []
          selector:
            action: {}

mode: queued
max: 6
max_exceeded: silent

variables:
  wired_light: !input wired_light
  brightness_step_pct: !input brightness_step_pct

triggers:
  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_short_press"
    subtype: "rotary_knob"
    id: pressed

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_double_press"
    subtype: "rotary_knob"
    id: double_pressed

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_long_press"
    subtype: "rotary_knob"
    id: held

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_long_release"
    subtype: "rotary_knob"
    id: released

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_started_rotating"
    subtype: "right"
    id: rotate_right

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_continued_rotating"
    subtype: "right"
    id: rotate_right

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_started_rotating"
    subtype: "left"
    id: rotate_left

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_continued_rotating"
    subtype: "left"
    id: rotate_left

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: pressed
        sequence:
          - action: light.toggle
            target:
              entity_id: !input wired_light

      - conditions:
          - condition: trigger
            id: double_pressed
        sequence: !input on_double_press

      - conditions:
          - condition: trigger
            id: held
        sequence: !input on_hold

      - conditions:
          - condition: trigger
            id: released
        sequence: !input on_release

      - conditions:
          - condition: trigger
            id: rotate_right
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input wired_light
            data:
              brightness_step_pct: !input brightness_step_pct

      - conditions:
          - condition: trigger
            id: rotate_left
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input wired_light
            data:
              brightness_step_pct: "{{ -1 * (brightness_step_pct | int) }}"
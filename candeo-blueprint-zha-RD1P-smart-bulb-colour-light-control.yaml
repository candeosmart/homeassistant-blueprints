blueprint:
  name: Candeo C-ZB-RD1P (REM or DPM mode) - 3-function Smart Bulb Control in ZHA
  description: >
    **Smart Bulb control for C-ZB-RD1P (Remote Mode or Dual Purpose Mode) using ZHA**

    Use a Candeo RD1P in either REM mode or DPM mode to control your smart bulbs - on/off state, brightness, white temperature, or colour.


    **Features:**

    - **Single press**: Toggles target lights on/off
    - **Double press**: Cycles through control modes (brightness / white temperature / colour)

    - **Rotary control:**
      - ☀️ In **Brightness mode** - adjusts light brightness
      - 🌡️ In **White balance mode** - adjusts colour temperature
      - 🎨 In **Colour mode** - cycles through hue spectrum


    **Requirements:**

    - C-ZB-RD1P or C-ZB-RD1Pv2 device in Remote Mode or Dual Purpose Mode
    - Compatible smart lights with brightness / colour temperature / colour support
    - Input select helper for mode tracking


    **Version**: 2026.8

    **Compatible Devices**:
    Candeo C-ZB-RD1P and C-ZB-RD1Pv2
    (Remote Mode or Dual Purpose Mode)

  domain: automation

  homeassistant:
    min_version: 2024.6.0

  input:
    device_section:
      name: Device & Target Selection
      icon: mdi:devices
      input:
        remote_device:
          name: C-ZB-RD1P Remote Device
          description: The C-ZB-RD1P or C-ZB-RD1Pv2 device in Remote Mode or Dual Purpose Mode.
          selector:
            device:
              filter:
                - integration: zha
                  manufacturer: Candeo
                  model: C-ZB-RD1P-REM
                - integration: zha
                  manufacturer: Candeo
                  model: C-ZB-RD1P-DPM
                - integration: zha
                  manufacturer: Candeo
                  model: C-ZB-RD1Pv2-REM
                - integration: zha
                  manufacturer: Candeo
                  model: C-ZB-RD1Pv2-DPM

        target_lights:
          name: Target Lights
          selector:
            target:
              entity:
                domain: light

        mode_helper:
          name: Mode Helper
          description: Input select helper with brightness, white_temp and colour options
          selector:
            entity:
              filter:
                - domain: input_select

    control_section:
      name: Control Settings
      icon: mdi:tune
      input:
        brightness_step:
          name: Brightness Step
          default: 10
          selector:
            number:
              min: 1
              max: 50
              unit_of_measurement: "%"

        color_temp_step:
          name: Colour Temperature Step
          default: 250
          selector:
            number:
              min: 50
              max: 500
              unit_of_measurement: "K"

        hue_step:
          name: Hue Step
          default: 15
          selector:
            number:
              min: 5
              max: 60
              unit_of_measurement: "degrees"

    advanced_section:
      name: Advanced Options
      icon: mdi:cog
      collapsed: true
      input:
        show_notifications:
          name: Show Mode Notifications
          default: true
          selector:
            boolean:

mode: queued
max: 6
max_exceeded: silent

variables:
  target_lights: !input target_lights
  brightness_step: !input brightness_step
  color_temp_step: !input color_temp_step
  hue_step: !input hue_step
  show_notifications: !input show_notifications

triggers:
  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_short_press"
    subtype: "rotary_knob"
    id: toggle_lights

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_double_press"
    subtype: "rotary_knob"
    id: cycle_mode

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_started_rotating"
    subtype: "right"
    id: rotate_right

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_continued_rotating"
    subtype: "right"
    id: rotate_right

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_started_rotating"
    subtype: "left"
    id: rotate_left

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_continued_rotating"
    subtype: "left"
    id: rotate_left

action:
  - choose:
      - conditions:
          - condition: trigger
            id: toggle_lights
        sequence:
          - action: light.toggle
            target: "{{ target_lights }}"

      - conditions:
          - condition: trigger
            id: cycle_mode
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "brightness"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input mode_helper
                    data:
                      option: "white_temp"

                  - if:
                      - condition: template
                        value_template: "{{ show_notifications }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "RD1P Remote Control"
                          message: "Mode: White Temperature Control 🌡️"
                          notification_id: "rd1p_mode"

              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "white_temp"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input mode_helper
                    data:
                      option: "colour"

                  - if:
                      - condition: template
                        value_template: "{{ show_notifications }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "RD1P Remote Control"
                          message: "Mode: Colour Control 🎨"
                          notification_id: "rd1p_mode"

              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "colour"
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input mode_helper
                    data:
                      option: "brightness"

                  - if:
                      - condition: template
                        value_template: "{{ show_notifications }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          title: "RD1P Remote Control"
                          message: "Mode: Brightness Control ☀️"
                          notification_id: "rd1p_mode"

            default:
              - action: input_select.select_option
                target:
                  entity_id: !input mode_helper
                data:
                  option: "brightness"

      - conditions:
          - condition: trigger
            id: rotate_right
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "brightness"
                sequence:
                  - action: light.turn_on
                    target: "{{ target_lights }}"
                    data:
                      brightness_step_pct: "{{ brightness_step }}"

              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "white_temp"
                sequence:
                  - action: light.turn_on
                    target: "{{ target_lights }}"
                    data:
                      color_temp_kelvin: >
                        {% if target_lights.entity_id is defined %}
                          {% set entity = target_lights.entity_id %}
                        {% elif target_lights.area_id is defined %}
                          {% set entity = area_entities(target_lights.area_id)
                            | select('match', 'light\\.') | list | first %}
                        {% else %}
                          {% set entity = expand(target_lights.entity_id)
                            | map(attribute='entity_id') | list | first %}
                        {% endif %}
                        {% if entity %}
                          {% set current = state_attr(entity, 'color_temp_kelvin') | int(4000) %}
                          {% set max_kelvin = state_attr(entity, 'max_color_temp_kelvin') | int(6500) %}
                          {% set new_temp = current + color_temp_step %}
                          {% if new_temp > max_kelvin %}
                            {{ max_kelvin }}
                          {% else %}
                            {{ new_temp }}
                          {% endif %}
                        {% else %}
                          4000
                        {% endif %}

              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "colour"
                sequence:
                  - action: light.turn_on
                    target: "{{ target_lights }}"
                    data:
                      hs_color: >
                        {% if target_lights.entity_id is defined %}
                          {% set entity = target_lights.entity_id %}
                        {% elif target_lights.area_id is defined %}
                          {% set entity = area_entities(target_lights.area_id)
                            | select('match', 'light\\.') | list | first %}
                        {% else %}
                          {% set entity = expand(target_lights.entity_id)
                            | map(attribute='entity_id') | list | first %}
                        {% endif %}
                        {% if entity %}
                          {% set hs = state_attr(entity, 'hs_color') %}
                          {% set current_hue = hs[0] | int(0) if hs else 0 %}
                          {% set current_sat = hs[1] | int(100) if hs else 100 %}
                          [{{ (current_hue + hue_step) % 360 }}, {{ current_sat }}]
                        {% else %}
                          [0, 100]
                        {% endif %}

      - conditions:
          - condition: trigger
            id: rotate_left
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "brightness"
                sequence:
                  - action: light.turn_on
                    target: "{{ target_lights }}"
                    data:
                      brightness_step_pct: "{{ -brightness_step }}"

              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "white_temp"
                sequence:
                  - action: light.turn_on
                    target: "{{ target_lights }}"
                    data:
                      color_temp_kelvin: >
                        {% if target_lights.entity_id is defined %}
                          {% set entity = target_lights.entity_id %}
                        {% elif target_lights.area_id is defined %}
                          {% set entity = area_entities(target_lights.area_id)
                            | select('match', 'light\\.') | list | first %}
                        {% else %}
                          {% set entity = expand(target_lights.entity_id)
                            | map(attribute='entity_id') | list | first %}
                        {% endif %}
                        {% if entity %}
                          {% set current = state_attr(entity, 'color_temp_kelvin') | int(4000) %}
                          {% set min_kelvin = state_attr(entity, 'min_color_temp_kelvin') | int(2000) %}
                          {% set new_temp = current - color_temp_step %}
                          {% if new_temp < min_kelvin %}
                            {{ min_kelvin }}
                          {% else %}
                            {{ new_temp }}
                          {% endif %}
                        {% else %}
                          4000
                        {% endif %}

              - conditions:
                  - condition: state
                    entity_id: !input mode_helper
                    state: "colour"
                sequence:
                  - action: light.turn_on
                    target: "{{ target_lights }}"
                    data:
                      hs_color: >
                        {% if target_lights.entity_id is defined %}
                          {% set entity = target_lights.entity_id %}
                        {% elif target_lights.area_id is defined %}
                          {% set entity = area_entities(target_lights.area_id)
                            | select('match', 'light\\.') | list | first %}
                        {% else %}
                          {% set entity = expand(target_lights.entity_id)
                            | map(attribute='entity_id') | list | first %}
                        {% endif %}
                        {% if entity %}
                          {% set hs = state_attr(entity, 'hs_color') %}
                          {% set current_hue = hs[0] | int(0) if hs else 0 %}
                          {% set current_sat = hs[1] | int(100) if hs else 100 %}
                          [{{ (current_hue - hue_step) % 360 }}, {{ current_sat }}]
                        {% else %}
                          [0, 100]
                        {% endif %}
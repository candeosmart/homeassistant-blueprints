blueprint:
  name: Candeo C-ZB-RD1Pv2 - Clear / Reset Bindings in zigbee2mqtt
  description: >
    **Clear and reset Zigbee bindings on a Candeo RD1-Pro v2**

    Removes all bindings stored on the RD1-Pro, then asks zigbee2mqtt
    to reconfigure the device.

    This gives the RD1-Pro a clean binding state while restoring the
    normal zigbee2mqtt coordinator bindings required by the device.


    ⚠️ **V2 FIRMWARE REQUIRED**

    Minimum firmware:

    - Zigbee v2.0.0
    - MCU v2.0.0

    A zigbee2mqtt version containing RD1-Pro v2 support is required.


    **What Happens:**

    1. All existing RD1-Pro Zigbee bindings are cleared.
    2. Customer-created direct bindings are removed.
    3. zigbee2mqtt reconfigures the RD1-Pro.
    4. Required coordinator bindings are recreated.


    **Use this when:**

    - You want to start again with a clean binding configuration.
    - Old or unknown direct bindings exist.
    - A binding selector has become out of sync.
    - You are troubleshooting direct binding.


    **Important:**

    This is intentionally more comprehensive than Unbind.
    Use the Unbind blueprint when you only want to remove one known target.


    **Version**: 2026.8

  domain: script

  homeassistant:
    min_version: 2024.6.0

  input:
    device_section:
      name: RD1-Pro
      icon: mdi:rotate-left
      input:
        rd1p_friendly_name:
          name: RD1-Pro Friendly Name
          description: >
            Exact zigbee2mqtt Friendly Name of the RD1-Pro v2.
          selector:
            text:

    mqtt_section:
      name: Zigbee2MQTT
      icon: mdi:access-point-network
      collapsed: true
      input:
        mqtt_base_topic:
          name: MQTT Base Topic
          default: zigbee2mqtt
          selector:
            text:

    feedback_section:
      name: Feedback
      icon: mdi:message-check
      collapsed: true
      input:
        show_notifications:
          name: Show Result Notification
          default: true
          selector:
            boolean:

mode: single
max_exceeded: silent

variables:
  rd1p_friendly_name: !input rd1p_friendly_name
  mqtt_base_topic: !input mqtt_base_topic
  show_notifications: !input show_notifications

sequence:
  # Step 1 - clear all bindings
  - variables:
      clear_transaction: >
        {{ 'candeo_clear_' ~ now().strftime('%Y%m%d%H%M%S%f') }}
      clear_request_topic: >
        {{ mqtt_base_topic ~ '/bridge/request/device/binds/clear' }}
      clear_response_topic: >
        {{ mqtt_base_topic ~ '/bridge/response/device/binds/clear' }}

  - action: mqtt.publish
    data:
      topic: "{{ clear_request_topic }}"
      payload: >-
        {{ {
          "target": rd1p_friendly_name,
          "transaction": clear_transaction
        } | to_json }}

  - wait_for_trigger:
      - trigger: mqtt
        topic: "{{ clear_response_topic }}"
        payload: "{{ clear_transaction }}"
        value_template: "{{ value_json.transaction | default('') }}"
    timeout: "00:00:30"
    continue_on_timeout: true

  - choose:
      # Clear succeeded -> reconfigure device
      - conditions:
          - condition: template
            value_template: >
              {{ wait.completed
                 and wait.trigger.payload_json.status == 'ok' }}
        sequence:
          - variables:
              configure_transaction: >
                {{ 'candeo_configure_' ~
                   now().strftime('%Y%m%d%H%M%S%f') }}
              configure_request_topic: >
                {{ mqtt_base_topic ~ '/bridge/request/device/configure' }}
              configure_response_topic: >
                {{ mqtt_base_topic ~ '/bridge/response/device/configure' }}

          - action: mqtt.publish
            data:
              topic: "{{ configure_request_topic }}"
              payload: >-
                {{ {
                  "id": rd1p_friendly_name,
                  "transaction": configure_transaction
                } | to_json }}

          - wait_for_trigger:
              - trigger: mqtt
                topic: "{{ configure_response_topic }}"
                payload: "{{ configure_transaction }}"
                value_template: >
                  {{ value_json.transaction | default('') }}
            timeout: "00:00:30"
            continue_on_timeout: true

          - choose:
              - conditions:
                  - condition: template
                    value_template: >
                      {{ wait.completed
                         and wait.trigger.payload_json.status == 'ok' }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ show_notifications }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          notification_id: candeo_rd1pv2_binding_reset
                          title: RD1-Pro Bindings Reset
                          message: >
                            Binding reset completed successfully.

                            RD1-Pro: {{ rd1p_friendly_name }}

                            All existing bindings were cleared and
                            zigbee2mqtt successfully reconfigured the device.

                            Customer direct bindings have been removed.

              - conditions:
                  - condition: template
                    value_template: "{{ not wait.completed }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ show_notifications }}"
                    then:
                      - action: persistent_notification.create
                        data:
                          notification_id: candeo_rd1pv2_binding_reset
                          title: RD1-Pro Reset – Reconfigure Timeout
                          message: >
                            Bindings were cleared, but no response was received
                            from the zigbee2mqtt reconfigure request.

                            RD1-Pro: {{ rd1p_friendly_name }}

                            Reconfigure the device manually in zigbee2mqtt.

            default:
              - if:
                  - condition: template
                    value_template: "{{ show_notifications }}"
                then:
                  - action: persistent_notification.create
                    data:
                      notification_id: candeo_rd1pv2_binding_reset
                      title: RD1-Pro Reset – Reconfigure Failed
                      message: >
                        Bindings were cleared, but zigbee2mqtt could not
                        reconfigure the RD1-Pro.

                        {{ wait.trigger.payload_json.error
                           | default('Unknown error') }}

    default:
      - if:
          - condition: template
            value_template: "{{ show_notifications }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: candeo_rd1pv2_binding_reset
              title: RD1-Pro Binding Reset Failed
              message: >
                The RD1-Pro bindings could not be cleared.

                RD1-Pro: {{ rd1p_friendly_name }}

                {% if not wait.completed %}
                No response was received from zigbee2mqtt.
                {% else %}
                {{ wait.trigger.payload_json.error
                   | default('Unknown error') }}
                {% endif %}
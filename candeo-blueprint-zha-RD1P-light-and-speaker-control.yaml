blueprint:
  name: Candeo C-ZB-RD1P (REM or DPM mode) - Light or Speaker Control via Helper in ZHA
  description: >
    **Dual control for C-ZB-RD1P (Remote Mode or Dual Purpose Mode) using ZHA**

    Use a Candeo RD1P to control either your smart lights or a media speaker from the same knob.

    A helper chooses the active target so presses and rotation do the right thing for lights or audio.

    Single press toggles the current target, double press switches targets, and rotation adjusts brightness or volume.


    **Features:**

    - **Single press**: Toggles the active target
      - 💡 If target is **lights** it toggles the selected light, group, or area
      - 🔊 If target is **speaker** it plays or pauses the media player

    - **Double press**: Cycles the helper between **lights** and **speaker**

    - **Rotary control:**
      - ➕ Right rotation increases **brightness** or **volume**
      - ➖ Left rotation decreases **brightness** or **volume**


    **Requirements:**

    - C-ZB-RD1P or C-ZB-RD1Pv2 device in Remote Mode or Dual Purpose Mode
    - ZHA with device actions available
    - Dimmable lights and a media_player supporting volume_level


    **Version**: 2026.8

    **Compatible Devices**:
    Candeo C-ZB-RD1P and C-ZB-RD1Pv2
    (Remote Mode or Dual Purpose Mode)

  domain: automation

  homeassistant:
    min_version: 2024.6.0

  input:
    remote_device:
      name: Candeo RD1-Pro Dimming Switch
      description: The C-ZB-RD1P or C-ZB-RD1Pv2 device in Remote Mode or Dual Purpose Mode.
      selector:
        device:
          filter:
            - integration: zha
              manufacturer: Candeo
              model: C-ZB-RD1P-REM
            - integration: zha
              manufacturer: Candeo
              model: C-ZB-RD1P-DPM
            - integration: zha
              manufacturer: Candeo
              model: C-ZB-RD1Pv2-REM
            - integration: zha
              manufacturer: Candeo
              model: C-ZB-RD1Pv2-DPM

    target_lights:
      name: Target Lights
      selector:
        target:
          entity:
            domain: light

    speaker_entity:
      name: Speaker (media_player)
      selector:
        entity:
          filter:
            - domain: media_player

    selection_helper:
      name: Active Target Helper
      selector:
        entity:
          filter:
            - domain: input_select

    brightness_step_pct:
      name: Brightness Step Percentage
      default: 10
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"

    volume_step_pct:
      name: Volume Step Percentage
      default: 5
      selector:
        number:
          min: 1
          max: 50
          unit_of_measurement: "%"

    show_notifications:
      name: Show Target Notifications
      default: true
      selector:
        boolean:

mode: queued
max: 6
max_exceeded: silent

variables:
  target_lights: !input target_lights
  speaker: !input speaker_entity
  selection_helper: !input selection_helper
  brightness_step_pct: !input brightness_step_pct
  volume_step_pct: !input volume_step_pct
  show_notifications: !input show_notifications

triggers:
  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_short_press"
    subtype: "rotary_knob"
    id: pressed

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "remote_button_double_press"
    subtype: "rotary_knob"
    id: double_pressed

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_started_rotating"
    subtype: "right"
    id: rotate_right

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_continued_rotating"
    subtype: "right"
    id: rotate_right

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_started_rotating"
    subtype: "left"
    id: rotate_left

  - trigger: device
    device_id: !input remote_device
    domain: zha
    type: "rotary_knob_continued_rotating"
    subtype: "left"
    id: rotate_left

condition: []

action:
  - choose:
      - conditions:
          - condition: trigger
            id: pressed
          - condition: state
            entity_id: !input selection_helper
            state: "lights"
        sequence:
          - action: light.toggle
            target: !input target_lights

      - conditions:
          - condition: trigger
            id: pressed
          - condition: state
            entity_id: !input selection_helper
            state: "speaker"
        sequence:
          - action: media_player.media_play_pause
            target:
              entity_id: !input speaker_entity

      - conditions:
          - condition: trigger
            id: double_pressed
        sequence:
          - action: input_select.select_next
            target:
              entity_id: !input selection_helper
            data:
              cycle: true

          - if:
              - condition: template
                value_template: "{{ show_notifications }}"
            then:
              - action: persistent_notification.create
                data:
                  title: "RD1P Active Target"
                  message: >
                    Target: {{ states(selection_helper) | title }}
                  notification_id: "rd1p_target"

      - conditions:
          - condition: trigger
            id: rotate_right
          - condition: state
            entity_id: !input selection_helper
            state: "lights"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              brightness_step_pct: "{{ brightness_step_pct }}"

      - conditions:
          - condition: trigger
            id: rotate_right
          - condition: state
            entity_id: !input selection_helper
            state: "speaker"
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: !input speaker_entity
            data:
              volume_level: >
                {% set step = (volume_step_pct | int(5)) / 100 %}
                {% set current = state_attr(speaker, 'volume_level') | float(0.5) %}
                {% set new = current + step %}
                {% if new > 1 %}
                  1
                {% else %}
                  {{ new | round(2) }}
                {% endif %}

      - conditions:
          - condition: trigger
            id: rotate_left
          - condition: state
            entity_id: !input selection_helper
            state: "lights"
        sequence:
          - action: light.turn_on
            target: !input target_lights
            data:
              brightness_step_pct: "{{ -1 * (brightness_step_pct | int) }}"

      - conditions:
          - condition: trigger
            id: rotate_left
          - condition: state
            entity_id: !input selection_helper
            state: "speaker"
        sequence:
          - action: media_player.volume_set
            target:
              entity_id: !input speaker_entity
            data:
              volume_level: >
                {% set step = (volume_step_pct | int(5)) / 100 %}
                {% set current = state_attr(speaker, 'volume_level') | float(0.5) %}
                {% set new = current - step %}
                {% if new < 0 %}
                  0
                {% else %}
                  {{ new | round(2) }}
                {% endif %}